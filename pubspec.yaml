name: easyshoppin_eshop
description: "Online store of goods and services"

publish_to: 'none'

version: 1.0.3+45

environment:
  sdk: '>=3.8.1 <4.0.0'

#-------------------- PACKAGES --------------------#

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.5.0
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^1.2.1
  audioplayers: ^6.5.1
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  geolocator: ^14.0.2
  location: ^8.0.1
  permission_handler: ^12.0.1
  photo_manager: ^3.7.1
  dotted_border: ^3.1.0
  mailer: ^6.6.0
  shared_preferences: ^2.5.3
  flutter_statusbarcolor_ns: ^0.6.0
  share_plus: ^12.0.1
  device_info_plus: ^12.2.0
  provider: ^6.1.5+1
  network_info_plus: ^7.0.0
  package_info_plus: ^8.2.1
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  speech_to_text_google_dialog: ^0.0.6
  camera: ^0.11.3
  flutter_svg: ^2.2.2
  flutter_image_compress: ^2.4.0
  geocoding: ^4.0.0
  webview_flutter: ^4.13.0
  bitsdojo_window: ^0.1.6
  flutter_phoenix: ^1.1.1
  window_manager: ^0.5.1
  win32: ^5.15.0
  ffi: ^2.1.4
  flutter_web_auth_2: ^4.1.0
  yandex_mapkit: ^4.2.1
  flutter_dotenv: ^6.0.0

  # Icons
  iconsax: ^0.0.8
  heroicons: ^0.11.0
  cupertino_icons: ^1.0.8
  bootstrap_icons: ^1.13.1
  material_symbols_icons: ^4.2874.0
  carbon_icons: ^0.0.1+2
  font_awesome_flutter: ^10.12.0
  ionicons: ^0.2.2
  remixicon: ^1.4.1
  mono_icons: ^1.0.0+2
  fluentui_system_icons: ^1.1.273
  solar_icons: ^0.0.5
  unicons: ^3.0.0
  eva_icons_flutter: ^3.1.0
  akar_icons_flutter: ^1.1.21
  typicons_flutter: ^0.5.0
  feather_icons: ^1.2.0
  mdi: ^5.0.0-nullsafety.0
  weather_icons: ^3.0.0
  tabler_icons: ^2.5.0+1
  line_awesome_flutter: ^3.0.1
  tabler_icons_flutter: ^2.11.0
  icons_plus: ^5.0.0
  phosphor_flutter: ^2.1.0

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^7.2.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_app_check: ^0.4.1+2

#-------------------- ./ PACKAGES END --------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Utility Packages
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  intl_translation: ^0.21.0
  intl_utils: ^2.8.12
  build_runner: ^2.10.3
  build_config: ^1.2.0

flutter_intl:
  enabled: true
  arb_dir: lib/localization/l10n
  output_dir: lib/generated/l10n

flutter:
  uses-material-design: true
  generate: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
  - assets/fonts/
  - assets/logos/
  - assets/images/categories/
  - assets/images/subcategories/
  - assets/images/content/
  - assets/images/banners/
  - assets/images/products/
  - assets/images/reviews/
  - assets/images/sales/
  - assets/images/animations/
  - assets/images/on_boarding_images/
  - assets/icons/brands/
  - assets/icons/payment_methods/
  - assets/icons/categories/
  - assets/icons/flags/
  - assets/icons/other/
  - assets/vectors/
  - assets/vectors/flags/
  - assets/vectors/logos/
  - assets/sounds/
  - lib/localization/l10n/

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica/Helvetica-Light.otf
          weight: 300
        - asset: assets/fonts/Helvetica/Helvetica-Regular.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Helvetica/Helvetica-Italic.otf
          weight: 500
        - asset: assets/fonts/Helvetica/Helvetica-Bold.otf
          weight: 800
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 800
    - family: Coolvetica
      fonts:
        - asset: assets/fonts/Coolvetica/Coolvetica-Italic.otf
          style: italic
        - asset: assets/fonts/Coolvetica/Coolvetica-Regular.otf
          weight: 400

flutter_icons:
  android: true
  ios: true
  image_path: assets/logos/easyshoppin_logo.png
  